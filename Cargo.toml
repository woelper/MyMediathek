[package]
name = "mymediathek"
version = "0.1.0"
edition = "2024"
description = "Search the German public broadcasters' media libraries, download with one click, watch offline"
repository = "https://github.com/woelper/MyMediathek"

[dependencies]
chrono = "0.4.45"
cpal = "0.18.2"
dirs = "7.0.0"
eframe = "0.36.2"
egui-phosphor = { version = "0.14.0", default-features = false, features = ["fill"] }
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "snapshot", "wgpu"] }

[package.metadata.bundle]
name = "MyMediathek"
identifier = "com.woelper.mymediathek"
icon = ["assets/icon.icns"]
category = "public.app-category.entertainment"
short_description = "Watch the public broadcasters' programmes offline"
